<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pho Ha Noi — Staff</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PHN Staff" />
</head>
<body>
  <div id="sessionBanner" class="session-banner" role="status" hidden>
    <span class="session-banner-msg">Your session expired — please sign in again.</span>
    <button type="button" class="session-banner-x" id="sessionBannerX" aria-label="Dismiss">✕</button>
  </div>
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand-logo"><img src="/brand.svg" alt="Phở Hà Nội" /></div>
      <div class="sub">Staff App</div>
      <div class="err" id="loginErr"></div>
      <label class="login-lbl" for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="Phone number" autocomplete="off" inputmode="numeric" />
      <label class="login-lbl" for="password">Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="off" />
      <button class="btn block" type="submit">Sign in</button>
      <div class="sub" style="margin-top:1rem;font-size:.76rem">Sign in with your 10-digit phone number.</div>
      <div class="sub" style="margin-top:.6rem;font-size:.8rem"><a href="/checkin" style="color:var(--red);font-weight:700;text-decoration:none">🍜 Customer self check-in →</a></div>
    </form>
  </div>
  <script>
    // Always open the sign-in form empty — ignore any browser/autofill carry-over.
    (function () {
      function clr() { var p = document.getElementById('phone'), w = document.getElementById('password'); if (p) p.value = ''; if (w) w.value = ''; }
      window.addEventListener('DOMContentLoaded', clr);
      window.addEventListener('load', function () { clr(); setTimeout(clr, 250); });
    })();
  </script>

  <div id="app" class="hidden">
    <div class="topbar">
      <div class="logo"><img src="/brand.svg" alt="Phở Hà Nội" class="logo-img" /> <span style="opacity:.7;font-weight:500;font-size:.9rem">· Staff</span></div>
      <div class="right">
        <span id="staffLive" class="live-badge hidden" data-state="" title="Real-time push connection"></span>
        <span id="locName" class="loc-badge hidden"></span>
        <select id="locPicker" class="hidden"></select>
        <span class="clock" id="clock"></span>
        <button class="btn hidden" id="alertBtn" style="padding:.5rem .8rem;background:#b91c1c;color:#fff" title="Send an urgent alert to staff on the floor">🔔 Alert</button>
        <a class="btn ghost hidden" id="staffClock" target="_blank" rel="noopener" style="padding:.5rem .8rem" title="Open the staff check-in / check-out kiosk">⏱ Staff Clock</a>
        <button class="btn ghost" id="logout" style="padding:.5rem .8rem">Sign out</button>
      </div>
    </div>
    <div class="subnav hidden" id="subnav"></div>
    <div class="wrap" id="view"></div>
  </div>

  <div id="modalHost"></div>
  <script>
    // Point the "Staff Clock" link at the Management app's clock kiosk.
    (function () {
      var h = location.hostname, url;
      if (h === 'localhost' || h === '127.0.0.1') url = 'http://localhost:4001/clock';
      else if (h.indexOf('waitlist') !== -1) url = location.protocol + '//' + h.replace('waitlist', 'management') + '/clock';
      else url = 'https://pho-ha-noi-management.fly.dev/clock';
      var a = document.getElementById('staffClock'); if (a) a.href = url;
    })();
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  </script>
  <script src="/app.js"></script>
</body>
</html>
