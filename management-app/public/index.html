<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise Restaurant Management System</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="sessionBanner" class="session-banner" role="status" hidden>
    <span class="session-banner-msg">Your session expired — please sign in again.</span>
    <button type="button" class="session-banner-x" id="sessionBannerX" aria-label="Dismiss">✕</button>
  </div>
  <!-- Login -->
  <div id="login" class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand-logo"><img src="/brand.svg" alt="Phở Hà Nội" /></div>
      <div class="sub" style="margin-top:.6rem">Enterprise Restaurant Management System</div>
      <div class="err" id="loginErr"></div>
      <input id="phone" type="tel" placeholder="Phone number" value="(408) 483-0030" autocomplete="username" inputmode="numeric" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn block" type="submit">Sign in</button>
      <div class="sub" style="margin-top:1rem;font-size:.78rem">
        Owner: (408) 483-0030 / Harry123!
      </div>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img class="logo-img" src="/brand.svg" alt="Phở Hà Nội" />
        <div class="logo-sub">Enterprise Restaurant Management System</div>
      </div>
      <div class="sidebar-user" id="sbUser"></div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="navAccount"><span class="nav-icon">⚙️</span>Account Settings</button>
        <button class="nav-item logout" id="logout"><span class="nav-icon">🚪</span>Sign Out</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="page-title" id="pageTitle">Overview</div>
        <div class="right">
          <select id="locPicker" class="hidden"></select>
          <span class="who" id="who"></span>
        </div>
      </div>
      <div class="tabs hidden" id="tabs"></div>
      <div class="content" id="view"></div>
    </div>
  </div>

  <div id="modalHost"></div>
  <script src="/app.js"></script>
</body>
</html>
