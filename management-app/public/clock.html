<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pho Ha Noi — Clock In / Out</title>
<style>
  :root{ --red:#930B19; --red-dark:#62070e; --gold:#cfa941; --bg:#f7f3ec; --surface:#fff;
    --ink:#2a2320; --muted:#6b6058; --line:#e7dece; --ok:#16a34a; --ok-bg:#dcfce7;
    --warn:#b45309; --warn-bg:#fef3c7; --err:#b42318; --err-bg:#fee2e2; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:linear-gradient(160deg,var(--red) 0%, var(--red-dark) 100%); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; min-height:100%; }
  .card{ background:var(--surface); border-radius:22px; width:100%; max-width:460px; padding:2rem 1.75rem 2.25rem;
    box-shadow:0 24px 60px rgba(0,0,0,.28); }
  .brand{ text-align:center; margin-bottom:.5rem; }
  .brand img.logo{ width:220px; max-width:74%; height:auto; }
  h1{ text-align:center; font-size:1.35rem; margin:.5rem 0 .1rem; color:var(--red-dark); }
  .loc{ text-align:center; color:var(--muted); font-size:1rem; margin:0 0 1.3rem; font-weight:600; }
  label{ display:block; font-size:.85rem; color:var(--muted); font-weight:600; margin:.2rem 0 .35rem; }
  #code{ width:100%; padding:1rem 1rem; font-size:1.6rem; letter-spacing:.28em; text-align:center;
    border:2px solid var(--line); border-radius:14px; font-family:inherit; }
  #code:focus{ outline:none; border-color:var(--gold); }
  .btn{ display:block; width:100%; border:none; border-radius:14px; padding:1rem; font-size:1.15rem; font-weight:700;
    cursor:pointer; margin-top:.9rem; font-family:inherit; }
  .btn.primary{ background:var(--red); color:#fff; }
  .btn.primary:hover{ background:var(--red-dark); }
  .btn.ok{ background:var(--ok); color:#fff; }
  .btn.ghost{ background:#efe7d9; color:var(--ink); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .row{ display:flex; gap:.8rem; }
  .row .btn{ flex:1; }
  .panel{ margin-top:1.1rem; border-radius:14px; padding:1rem 1.1rem; font-size:1.05rem; line-height:1.45;
    text-align:center; display:none; }
  .panel.show{ display:block; }
  .panel.info{ background:var(--ok-bg); color:#14532d; }
  .panel.err{ background:var(--err-bg); color:var(--err); }
  .panel.warn{ background:var(--warn-bg); color:var(--warn); }
  .panel .big{ font-size:1.25rem; font-weight:700; display:block; margin-bottom:.2rem; }
  .picker a{ display:block; text-align:center; padding:1rem; margin-top:.6rem; border:1px solid var(--line);
    border-radius:14px; text-decoration:none; color:var(--red-dark); font-weight:700; font-size:1.15rem; }
  .picker a:hover{ background:var(--bg); }
  .hint{ text-align:center; color:var(--muted); font-size:.82rem; margin-top:1rem; }
  .clock{ text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; font-size:.95rem; margin-top:.3rem; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img class="logo" src="/brand.svg" alt="Phở Hà Nội" /></div>
    <h1 id="title">Clock In / Out</h1>
    <div class="loc" id="loc"></div>
    <div class="clock" id="now"></div>

    <!-- Location picker (bare /clock) -->
    <div class="picker" id="picker" hidden></div>

    <!-- Code entry + actions (/clock/<slug>) -->
    <div id="kiosk" hidden>
      <label for="code">Enter your employee code</label>
      <input id="code" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="######" aria-label="Employee code" />
      <button class="btn primary" id="go">Continue</button>

      <div class="panel" id="panel"></div>

      <div id="actions" hidden>
        <div class="row">
          <button class="btn ok" id="clockIn">Clock In</button>
          <button class="btn ghost" id="clockOut">Clock Out</button>
        </div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch('/api/timeclock' + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, d };
};
// Slug from the path: /clock or /clock/<slug>
const slug = decodeURIComponent(location.pathname.replace(/^\/clock\/?/, '')).trim();

function tick(){ const n=new Date(); $('now').textContent = n.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}) + ' · ' + n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
setInterval(tick, 1000); tick();

function showPanel(kind, html){ const p=$('panel'); p.className='panel show '+kind; p.innerHTML=html; }
function hidePanel(){ $('panel').className='panel'; }

let staffName = '';
function resetSoon(ms){ clearTimeout(resetSoon._t); resetSoon._t=setTimeout(resetForm, ms||7000); }
function resetForm(){ $('code').value=''; $('actions').hidden=true; hidePanel(); staffName=''; $('code').focus(); }

async function lookup(){
  const code = $('code').value.trim();
  if (!code){ $('code').focus(); return; }
  const { d } = await api(`/kiosk/${encodeURIComponent(slug)}/state`, { method:'POST', body: JSON.stringify({ employee_code: code }) });
  if (!d.ok){ $('actions').hidden = true; showPanel('err', d.message || 'Please check your employee code.'); return; }
  staffName = d.name;
  showPanel('info', `<span class="big">${escapeHtml(d.greeting)}</span>${d.clocked_in ? `You’ve been clocked in since ${escapeHtml(d.since)}.` : 'Ready when you are.'}`);
  $('actions').hidden = false;
  $('clockIn').disabled = !d.can_in;
  $('clockOut').disabled = !d.can_out;
  resetSoon(30000); // idle reset
}

async function punch(action){
  const code = $('code').value.trim(); if (!code) return;
  let res = await api(`/kiosk/${encodeURIComponent(slug)}/punch`, { method:'POST', body: JSON.stringify({ employee_code: code, action }) });
  if (res.d && res.d.confirm){
    if (!confirm(res.d.message)) return;   // staff must accept the warning
    res = await api(`/kiosk/${encodeURIComponent(slug)}/punch`, { method:'POST', body: JSON.stringify({ employee_code: code, action, confirm: true }) });
  }
  if (!res.ok){ showPanel('err', (res.d && res.d.error) || 'Something went wrong — please try again.'); return; }
  $('actions').hidden = true;
  showPanel(action === 'out' ? 'warn' : 'info', `<span class="big">${escapeHtml(res.d.message)}</span>${res.d.at ? 'at ' + escapeHtml(res.d.at) : ''}`);
  resetSoon(7000);
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function start(){
  if (!slug){
    // Bare /clock — show a location picker.
    $('title').textContent = 'Choose your location';
    const { d } = await api('/kiosk-locations');
    const wrap = $('picker'); wrap.hidden = false;
    wrap.innerHTML = (Array.isArray(d) ? d : []).map(l => `<a href="/clock/${encodeURIComponent(l.slug)}">${escapeHtml(l.display)}</a>`).join('') || '<p class="hint">No locations available.</p>';
    return;
  }
  const { ok, d } = await api(`/kiosk/${encodeURIComponent(slug)}`);
  if (!ok){ $('title').textContent = 'Location not found'; $('loc').textContent = 'Check the address and try again.'; return; }
  document.title = `Clock — ${d.display}`;
  $('loc').textContent = d.display;
  $('kiosk').hidden = false;
  $('hint').textContent = 'Enter your 6-digit employee code to clock in or out.';
  $('go').onclick = lookup;
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
  $('clockIn').onclick = () => punch('in');
  $('clockOut').onclick = () => punch('out');
  $('code').focus();
}
start();
</script>
</body>
</html>
