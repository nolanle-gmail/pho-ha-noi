<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7f1414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Shift Board — Phở Hà Nội</title>
<style>
  :root{
    --brand:#B91C1C; --brand-deep:#7f1414; --ink:#241a15; --muted:#6e5f51; --line:#e7dccc;
    --paper:#f3ede3; --board:#fbf9f4;
    --red:#b91c1c; --red-bg:#fbe7e5; --amber:#b45309; --amber-bg:#fdf0d9;
    --blue:#1d4ed8; --blue-bg:#e6edfc; --green:#15803d; --green-bg:#e4f3e9; --grey:#6b7280; --grey-bg:#eceae6;
    --purple:#7c3aed; --purple-bg:#f0e6fe;
    --rowh:64px; --fs:1rem;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header{ background:linear-gradient(180deg,var(--brand-deep),var(--brand)); color:#fff;
    padding:calc(.45rem + env(safe-area-inset-top)) 1.1rem .5rem; display:flex; align-items:center; gap:1rem; flex:0 0 auto; }
  header img.logo{ height:32px; width:auto; }
  header .h-t{ font-weight:800; font-size:1.45rem; display:flex; align-items:baseline; gap:.55rem; white-space:nowrap; }
  header .h-loc{ opacity:.95; }
  header .h-date{ opacity:.8; font-weight:700; font-size:.9rem; }
  header .spacer{ flex:1; }
  .legend{ display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
  .leg{ background:rgba(255,255,255,.14); border-radius:999px; padding:.26rem .66rem; font-weight:800; font-size:.92rem;
    display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; }
  .leg .dot{ width:.78rem; height:.78rem; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.3) inset; }
  .leg .n{ font-variant-numeric:tabular-nums; }
  .leg.off{ opacity:.45; }
  header .clockwrap{ display:flex; flex-direction:column; align-items:flex-end; margin-left:.3rem; }
  header .clock{ font-weight:800; font-size:1.3rem; font-variant-numeric:tabular-nums; }
  header .upd{ opacity:.82; font-size:.68rem; }
  header button{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:10px; font:inherit; font-weight:800; font-size:1.15rem; padding:.28rem .56rem; cursor:pointer; }

  main{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:.5rem .7rem .3rem; }
  /* Board = one or more columns side by side, so everyone fits on ONE screen (no page-flipping). */
  .board{ flex:1 1 auto; display:flex; min-height:0; }
  .col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; min-height:0; padding:0 .55rem; }
  .col:first-child{ padding-left:0; }
  .col:last-child{ padding-right:0; }
  .col + .col{ border-left:2px solid var(--line); }
  .board.cols-2 .trow,.board.cols-2 .thead{ padding-left:.45rem; padding-right:.45rem; }
  .board.cols-3 .trow,.board.cols-3 .thead{ padding-left:.35rem; padding-right:.35rem; }
  .thead,.trow{ display:grid; grid-template-columns:2fr 2.6fr 1.5fr 1.9fr; align-items:center; gap:.5rem; }
  .thead{ flex:0 0 auto; padding:.2rem .7rem .3rem; color:var(--muted); font-weight:800; font-size:.8rem;
    text-transform:uppercase; letter-spacing:.03em; border-bottom:2px solid var(--line); }
  .thead .num,.trow .num{ text-align:center; }
  .rows{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .trow{ height:var(--rowh); padding:0 .7rem; border-bottom:1px solid var(--line);
    background:var(--board); border-left:7px solid transparent; }
  /* Row color by state: red = late / long break, amber = missed break / break soon / due. */
  .trow.row-late,.trow.row-longbreak{ background:var(--red-bg); border-left-color:var(--red); }
  .trow.row-missed,.trow.row-soon,.trow.row-due{ background:var(--amber-bg); border-left-color:var(--amber); }
  .trow.row-break{ background:var(--blue-bg); border-left-color:var(--blue); }
  /* Purple = a timed day task is about to start (and still not started) — flashes until they Start it. */
  .trow.row-tasksoon{ background:var(--purple-bg); border-left-color:var(--purple); animation:flashPurple 1.25s ease-in-out infinite; }
  .trow.row-soon{ animation:flashAmber 1.25s ease-in-out infinite; }
  .trow.row-longbreak{ animation:flashRed 1.25s ease-in-out infinite; }
  .trow.dim{ opacity:.62; }
  /* Staff cell: name on top, the scheduled shift hours as a small line underneath. */
  .who{ min-width:0; display:flex; flex-direction:column; justify-content:center; gap:.08rem; }
  .nm{ font-weight:800; font-size:calc(var(--fs) * .9); line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .when{ color:var(--muted); font-weight:600; font-size:calc(var(--fs) * .58); line-height:1.1;
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .when .sdot{ margin:0 .3em; }
  .punch{ font-weight:500; font-size:calc(var(--fs) * .8); font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap; }
  .punch.late{ color:var(--red); }
  .punch .ded{ color:var(--muted); font-weight:500; }
  .punch .sub{ display:block; font-size:calc(var(--fs) * .66); font-weight:600; }
  .brk{ font-weight:800; font-size:calc(var(--fs) * .72); text-align:center; white-space:nowrap; }
  .brk .o,.brk-live .o{ color:var(--red); font-size:.8em; font-weight:800; }
  .brk .ok,.brk-live.ok{ color:var(--muted); font-weight:700; }
  .brk-live.o{ color:var(--red); }
  .bchips{ display:flex; gap:.3rem; flex-wrap:wrap; justify-content:center; align-items:center; }
  .bchip{ font-weight:800; font-size:calc(var(--fs) * .64); padding:.12em .46em; border-radius:7px; background:#fff;
    color:var(--ink); box-shadow:0 0 0 1.5px var(--line) inset; font-variant-numeric:tabular-nums; }
  .bchip.past{ opacity:.42; }
  .bchip.soon{ background:var(--amber); color:#fff; box-shadow:none; }
  .bchip.done{ background:var(--green-bg); color:var(--green); box-shadow:0 0 0 1.5px var(--green) inset; }
  .bchip.over{ background:var(--red-bg); color:var(--red); box-shadow:0 0 0 1.5px var(--red) inset; }
  /* Whole-row flash: amber when a scheduled break is ~10 min out ("about to break"),
     red while a break has already run over the limit ("long break"),
     purple when a timed task is about to start and still not started. */
  @keyframes flashAmber{ 0%,100%{ background:var(--amber-bg); } 50%{ background:#fbe1a0; } }
  @keyframes flashRed{ 0%,100%{ background:var(--red-bg); } 50%{ background:#f4b2aa; } }
  @keyframes flashPurple{ 0%,100%{ background:var(--purple-bg); } 50%{ background:#ddc4fb; } }
  /* Combined In · Out · Break column: three parts split by "||" dividers, e.g. 10a || 5:15p || 1:45p 4:15p */
  .io{ display:flex; align-items:center; justify-content:center; gap:.3rem; min-width:0; overflow:hidden;
    font-weight:600; font-size:calc(var(--fs) * .78); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .io .io-sep{ color:var(--muted); opacity:.5; font-weight:700; }
  .io .late{ color:var(--red); }
  .io .ded{ color:var(--muted); font-weight:500; }
  .io .iop{ display:inline-flex; align-items:center; gap:.25rem; }
  /* In / Out as colored pills (same chip shape as the break chips) so they're easy to tell apart:
     In = green, Out = grey, a late clock-in = red. */
  .iochip{ font-weight:800; font-size:calc(var(--fs) * .64); padding:.12em .5em; border-radius:999px;
    white-space:nowrap; display:inline-block; font-variant-numeric:tabular-nums; }
  .iochip.in{ background:var(--green); color:#fff; }
  .iochip.in.late{ background:var(--red); color:#fff; }
  .iochip.out{ background:var(--grey); color:#fff; }
  .iochip.none{ color:var(--muted); font-weight:600; }
  .io-h{ text-align:center; }
  .io-h .io-sep{ opacity:.6; margin:0 .2em; }
  /* Tasks column: each task is "CODE, time"; the imminent one flashes purple until started. */
  .tasks-cell{ min-width:0; overflow:hidden; }
  .tasks{ display:flex; flex-direction:column; gap:.1rem; justify-content:center; }
  .tchip{ font-weight:700; font-size:calc(var(--fs) * .7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-variant-numeric:tabular-nums; }
  .tchip .tc{ font-weight:800; }
  .tchip.done{ color:var(--muted); text-decoration:line-through; }
  .tchip.started{ color:var(--green); }
  .tchip.soon{ color:var(--purple); animation:flash 1.3s ease-in-out infinite; }
  .badges{ display:flex; gap:.35rem; flex-wrap:wrap; align-items:center; }
  .bdg{ font-weight:800; font-size:calc(var(--fs) * .62); padding:.16em .5em; border-radius:999px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.25em; letter-spacing:.01em; }
  .bdg.red{ background:var(--red); color:#fff; }
  .bdg.amber{ background:var(--amber); color:#fff; }
  .bdg.blue{ background:var(--blue); color:#fff; }
  .bdg.purple{ background:var(--purple); color:#fff; }
  .bdg.green{ background:var(--green-bg); color:var(--green); box-shadow:0 0 0 1.5px var(--green) inset; }
  .bdg.grey{ background:var(--grey-bg); color:var(--grey); box-shadow:0 0 0 1.5px var(--grey) inset; }
  .bdg.wrap{ white-space:normal; text-align:center; line-height:1.08; }
  .bdg.flash{ animation:flash 1.3s ease-in-out infinite; }
  @keyframes flash{ 0%,100%{ filter:none; } 50%{ filter:brightness(1.22); } }

  footer{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:.25rem .9rem; color:var(--muted); font-weight:700; font-size:.82rem; }
  .pager{ display:flex; align-items:center; gap:.5rem; }
  .dots{ display:flex; gap:.3rem; }
  .dots i{ width:.6rem; height:.6rem; border-radius:50%; background:var(--line); display:inline-block; }
  .dots i.on{ background:var(--brand); }
  .foot-legend{ display:flex; gap:.9rem; flex-wrap:wrap; }
  .foot-legend b{ color:var(--ink); }

  .picks{ max-width:560px; margin:auto; display:grid; gap:.7rem; width:100%; padding:1rem; }
  .pick{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.3rem; font-size:1.3rem; font-weight:800;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-decoration:none; color:var(--ink); }
  .pick::after{ content:"›"; color:var(--muted); font-size:1.6rem; margin-left:.6rem; }
  .note{ text-align:center; color:var(--muted); padding:3rem 1rem; font-size:1.3rem; max-width:640px; margin:auto; }
  .note h2{ color:var(--ink); font-size:1.8rem; margin:.3rem 0; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/brand.svg" alt="Phở Hà Nội" onerror="this.style.display='none'" />
  <div class="h-t">🕒 Shift Board <span class="h-loc" id="hLoc"></span></div>
  <div class="h-date" id="hDate"></div>
  <div class="spacer"></div>
  <div class="legend" id="legend"></div>
  <div class="clockwrap"><div class="clock" id="clock">—</div><div class="upd" id="upd"></div></div>
  <button id="full" title="Fullscreen">⛶</button>
</header>
<main id="main"><div class="note">Loading…</div></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const shortLoc = (n) => String(n || '').replace(/^Ph[oở]\s*H[aà]\s*N[oộ]i\s*[—–-]\s*/i, '').trim() || n;
const SLUG = decodeURIComponent((location.pathname.match(/^\/shiftboard\/(.+?)\/?$/i) || [, ''])[1] || '').trim();

let dataTimer = null, pageTimer = null, lastData = null, curPage = 0, pages = 1, NOWMIN = 0;
const PAGE_SECONDS = 15, REFRESH_SECONDS = 8, MIN_ROW = 48, MAX_ROW = 92, MAX_COLS = 3;
const fmt12 = (t) => { const [h, m] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'a' : 'p'}`; };
// Compact 12-hour: drops ":00" on a whole hour (10:00→10a, 17:15→5:15p) — used in the tight In·Out·Break + Tasks columns.
const fmt12c = (t) => { const [h, m] = String(t).split(':').map(Number); const hh = ((h + 11) % 12) + 1, ap = h < 12 ? 'a' : 'p'; return m ? `${hh}:${String(m).padStart(2, '0')}${ap}` : `${hh}${ap}`; };
const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

async function api(path) {
  const r = await fetch('/api/shiftboard' + path, { headers: { 'Content-Type': 'application/json' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok && !d.error) throw new Error('Something went wrong.');
  return d;
}

// Keep the screen awake + a live wall clock.
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (SLUG) load(); } });
function tickClock() { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
setInterval(tickClock, 10000); tickClock();
$('full').onclick = () => { const el = document.documentElement; if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el); else document.exitFullscreen && document.exitFullscreen(); };

// ── Bare /shiftboard: pick a store ──────────────────────────────────────────
async function pickStore() {
  $('hLoc').textContent = ''; $('legend').innerHTML = ''; $('upd').textContent = ''; $('hDate').textContent = '';
  let d; try { d = await api('/locations'); } catch { $('main').innerHTML = '<div class="note">Couldn’t load locations. Try again.</div>'; return; }
  if (!d.locations || !d.locations.length) { $('main').innerHTML = '<div class="note">No locations yet.</div>'; return; }
  $('main').innerHTML = '<div class="picks"><div class="note" style="padding:0 0 .4rem">Pick a location to show on this screen — then bookmark it / add to the home screen.</div>'
    + d.locations.map(l => `<a class="pick" href="/shiftboard/${esc(l.slug)}">${esc(shortLoc(l.name))}</a>`).join('') + '</div>';
}

// ── Status badges for one staffer (most-severe first) ───────────────────────
function badgesFor(s, limit) {
  const b = [];
  if (s.task_soon) b.push(`<span class="bdg purple flash">📋 START ${esc(s.task_soon_code || 'TASK')}${s.task_soon_in != null ? (s.task_soon_in > 0 ? ` IN ${s.task_soon_in}m` : ' NOW') : ''}</span>`);
  if (s.late_min > 0) b.push(`<span class="bdg red flash">⏰ LATE ${s.late_min}m${s.status === 'not_in' ? ' · NOT IN' : ''}</span>`);
  if (s.long_break) b.push(`<span class="bdg red wrap">☕ LONGER THAN 10-MIN BREAK</span>`);
  if (s.break_missed) b.push(`<span class="bdg amber">⚠ BREAK MISSED</span>`);
  if (s.break_soon_min != null) b.push(`<span class="bdg amber">☕ BREAK IN ${s.break_soon_min}m${s.next_break ? ` · ${fmt12(s.next_break)}` : ''}</span>`);
  if (s.break_due) b.push(`<span class="bdg amber">☕ DUE A BREAK</span>`);
  if (s.on_break && !s.long_break) b.push(`<span class="bdg blue">☕ ON BREAK ${s.break_elapsed_min}m</span>`);
  if (!b.length) {
    if (s.status === 'in') b.push(`<span class="bdg green">✓ ON THE CLOCK</span>`);
    else if (s.status === 'out') b.push(`<span class="bdg grey">● DONE</span>`);
    else if (s.status === 'not_in') b.push(`<span class="bdg grey">○ NOT IN YET</span>`);
  }
  return b.join('');
}

// Breaks cell. On break → the live timer next to the break's start time, with "(N min
// extra)" if it's already run over. Once breaks are taken → show each break's TIME with
// "(Nm ext)" in red for any that ran long. Before any break → the scheduled break
// TIME(S) as chips (next one amber, past dimmed, flashing row 10 min out).
function breakCell(s) {
  if (s.on_break) {
    const extra = s.break_over_now > 0 ? ` <span class="o">(${s.break_over_now}m ext)</span>` : '';
    return `<span class="brk-live ${s.break_over_now > 0 ? 'o' : ''}">☕ ${s.break_start ? fmt12(s.break_start) + ' · ' : ''}${s.break_elapsed_min}m${extra}</span>`;
  }
  if (s.breaks && s.breaks.length) {
    return `<div class="bchips">${s.breaks.map(b =>
      `<span class="bchip ${b.over > 0 ? 'over' : 'done'}">${fmt12(b.at)}${b.over > 0 ? ` <span class="o">(${b.over}m ext)</span>` : ''}</span>`).join('')}</div>`;
  }
  if (s.sched_breaks && s.sched_breaks.length) {
    const chips = s.sched_breaks.map(t => {
      const soon = s.next_break === t && s.break_soon_min != null;
      const past = toMin(t) < NOWMIN;
      return `<span class="bchip ${soon ? 'soon' : past ? 'past' : ''}">${fmt12(t)}</span>`;
    }).join('');
    return `<div class="bchips">${chips}</div>`;
  }
  return '<span class="ok">—</span>';
}

// Combined In · Out · Break cell: "10a || 5:15p || 1:45p 4:15p". The Break part keeps its ORIGINAL look —
// the pill/oval chips from breakCell (scheduled times, the actual break time(s), or the live on-break timer).
function ioCell(s) {
  const lateHere = s.late_min > 0 && s.status !== 'not_in';
  const inPart = s.clock_in
    ? `<span class="iochip in${lateHere ? ' late' : ''}">${fmt12c(s.clock_in)}</span>`
    : (s.status === 'not_in' && s.late_min > 0 ? `<span class="iochip in late">LATE</span>` : '<span class="iochip none">—</span>');
  const outPart = s.clock_out ? `<span class="iochip out">${fmt12c(s.clock_out)}</span>` : `<span class="iochip none">${s.status === 'out' ? '—' : '·'}</span>`;
  return `<span class="iop">${inPart}</span><span class="io-sep">||</span>`
    + `<span class="iop">${outPart}</span><span class="io-sep">||</span>`
    + `<span class="iop brk">${breakCell(s)}</span>`;
}

// Tasks cell: each day-task as "CODE, time" (done = struck through, started = green, imminent = purple flash).
function taskCell(s) {
  const ts = s.tasks || [];
  if (!ts.length) return '<span class="ded" style="color:var(--muted)">—</span>';
  return `<div class="tasks">${ts.map(t => {
    const cls = t.done ? 'done' : t.started ? 'started' : t.soon ? 'soon' : '';
    const tm = t.time ? `, ${fmt12c(t.time)}` : '';
    const mark = t.done ? ' ✓' : t.started ? ' ▸' : '';
    return `<span class="tchip ${cls}"><span class="tc">${esc(t.code || '—')}</span>${tm}${mark}</span>`;
  }).join('')}</div>`;
}

function rowHtml(s) {
  // Whole-row color + flash by the most urgent state: red = late / long break, purple = a timed task
  // about to start (and not yet started), amber = missed break / break coming up / due a break. A long
  // break (red), an imminent task (purple) and an imminent break (amber) flash the row.
  const stateClass = s.long_break ? 'row-longbreak'
    : s.task_soon ? 'row-tasksoon'
    : s.late_min > 0 ? 'row-late'
    : s.break_missed ? 'row-missed'
    : s.break_soon_min != null ? 'row-soon'
    : s.break_due ? 'row-due'
    : s.on_break ? 'row-break' : '';
  const dim = s.status === 'out' ? ' dim' : '';
  const sched = (s.shift_blocks && s.shift_blocks.length)
    ? s.shift_blocks.map(b => `${fmt12(b.start)}–${b.end ? fmt12(b.end) : '?'}`).join('<span class="sdot">·</span>')
    : '—';
  return `<div class="trow ${stateClass}${dim}">
    <div class="who"><div class="nm">${esc(s.name)}</div><div class="when">${sched}</div></div>
    <div class="io">${ioCell(s)}</div>
    <div class="tasks-cell">${taskCell(s)}</div>
    <div class="badges">${badgesFor(s)}</div>
  </div>`;
}

function renderChrome(d) {
  $('hLoc').textContent = shortLoc(d.location.name || '');
  document.title = 'Shift Board · ' + shortLoc(d.location.name || '');
  const dt = new Date((d.date || '') + 'T00:00:00');
  $('hDate').textContent = isNaN(dt) ? '' : dt.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  const sm = d.summary || {};
  const L = [
    ['on_clock', 'On clock', 'var(--green)', sm.on_clock],
    ['task_soon', 'Task due', 'var(--purple)', sm.task_soon],
    ['late', 'Late', 'var(--red)', sm.late],
    ['long_break', 'Long break', 'var(--red)', sm.long_break],
    ['break_missed', 'Missed break', 'var(--amber)', sm.break_missed],
    ['break_due', 'Due break', 'var(--amber)', sm.break_due],
    ['done', 'Done', 'var(--grey)', sm.done],
    ['not_in', 'Not in', 'var(--grey)', sm.not_in],
  ];
  $('legend').innerHTML = L.map(([k, lbl, c, n]) =>
    `<span class="leg ${n ? '' : 'off'}"><span class="dot" style="background:${c}"></span>${lbl} <span class="n">${n || 0}</span></span>`).join('');
  $('upd').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

// One column's header row.
function colHeader() {
  return `<div class="thead"><div>Staff</div>`
    + `<div class="io-h">In<span class="io-sep">||</span>Out<span class="io-sep">||</span>Break</div>`
    + `<div>Tasks</div><div>Status</div></div>`;
}

// Lay staff out side by side across as many columns as it takes to show EVERYONE on one
// screen — rows grow to fill when there are few, and pack into 2–3 columns when there are
// many, instead of flipping through pages. (Pages remain only as a last resort when even
// MAX_COLS columns can't hold everyone at a readable row height.)
function layout() {
  const d = lastData; if (!d) return;
  const staff = d.staff || [];
  $('main').innerHTML = `<div class="board" id="board"></div>
    <footer><div class="foot-legend">
        <span><b style="color:var(--red)">●</b> Late / long break</span>
        <span><b style="color:var(--purple)">●</b> Task starting</span>
        <span><b style="color:var(--amber)">●</b> Heads-up</span>
        <span>Break limit <b>${(d.thresholds && d.thresholds.break_limit_min) || 10} min</b></span>
      </div><div class="pager" id="pager"></div></footer>`;
  const board = $('board');
  if (!staff.length) {
    board.innerHTML = '<div class="note"><h2>No one scheduled today</h2>Nobody is on the schedule for this location today.</div>';
    pages = 1; const pg0 = $('pager'); if (pg0) pg0.textContent = ''; return;
  }
  // Measure the rows area of one full-height column (its header already subtracted).
  board.className = 'board cols-1';
  board.innerHTML = `<div class="col">${colHeader()}<div class="rows"></div></div>`;
  const colRowsH = (board.querySelector('.rows') || board).clientHeight || board.clientHeight;
  const fitPerCol = Math.max(1, Math.floor(colRowsH / MIN_ROW));
  // Columns needed to show everyone at once (capped at MAX_COLS).
  let cols = Math.min(MAX_COLS, Math.max(1, Math.ceil(staff.length / fitPerCol)));
  const pageCap = cols * fitPerCol;
  pages = Math.max(1, Math.ceil(staff.length / pageCap));
  if (curPage >= pages) curPage = 0;
  const pageStaff = staff.slice(curPage * pageCap, curPage * pageCap + pageCap);
  const perCol = Math.max(1, Math.ceil(pageStaff.length / cols));
  cols = Math.max(1, Math.min(cols, Math.ceil(pageStaff.length / perCol)));  // no empty trailing columns
  const rowH = Math.max(MIN_ROW, Math.min(MAX_ROW, Math.floor(colRowsH / perCol)));
  document.documentElement.style.setProperty('--rowh', rowH + 'px');
  document.documentElement.style.setProperty('--fs', Math.max(0.78, Math.min(1.15, rowH / 56)).toFixed(3) + 'rem');
  // Fill the columns, left to right, top to bottom (keeps the server's ordering readable).
  board.className = 'board cols-' + cols;
  board.innerHTML = '';
  for (let c = 0; c < cols; c++) {
    const slice = pageStaff.slice(c * perCol, c * perCol + perCol);
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = colHeader() + `<div class="rows">${slice.map(rowHtml).join('')}</div>`;
    board.appendChild(col);
  }
  const pager = $('pager');
  if (pager) pager.innerHTML = pages > 1
    ? `<span>Page ${curPage + 1} / ${pages}</span><span class="dots">${Array.from({ length: pages }, (_, i) => `<i class="${i === curPage ? 'on' : ''}"></i>`).join('')}</span>`
    : `<span>${staff.length} staff${cols > 1 ? ' · ' + cols + ' columns' : ''}</span>`;
}

function render(d) {
  lastData = d;
  NOWMIN = d.now_min || 0;
  renderChrome(d);
  layout();
}

async function load() {
  clearTimeout(dataTimer);
  if (!SLUG) return;
  let d; try { d = await api('/board?slug=' + encodeURIComponent(SLUG)); }
  catch (e) { if (!lastData) $('main').innerHTML = `<div class="note">${esc(e.message)}</div>`; dataTimer = setTimeout(load, REFRESH_SECONDS * 1000); return; }
  if (!d.ok) { $('main').innerHTML = `<div class="note"><h2>Shift Board unavailable</h2>${esc(d.error || '')}</div>`; dataTimer = setTimeout(load, REFRESH_SECONDS * 1000); return; }
  render(d);
  dataTimer = setTimeout(load, REFRESH_SECONDS * 1000);   // constant refresh
}

// Flip between pages every PAGE_SECONDS (only matters in the rare case the day has more
// staff than fit side by side across MAX_COLS columns at once).
pageTimer = setInterval(() => { if (pages > 1) { curPage = (curPage + 1) % pages; layout(); } }, PAGE_SECONDS * 1000);

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(layout, 180); });
(function boot() { keepAwake(); if (SLUG) load(); else pickStore(); })();
</script>
</body>
</html>
