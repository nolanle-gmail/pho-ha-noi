<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pho Ha Noi — Inventory Scanner</title>
<style>
  :root{ --red:#930B19; --red-dark:#62070e; --gold:#cfa941; --bg:#f7f3ec; --surface:#fff;
    --ink:#2a2320; --muted:#6b6058; --line:#e7dece; --ok:#16a34a; --ok-bg:#dcfce7;
    --warn:#b45309; --warn-bg:#fef3c7; --err:#b42318; --err-bg:#fee2e2; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ background:linear-gradient(160deg,var(--red) 0%, var(--red-dark) 100%); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:4vh 16px; }
  .card{ background:var(--surface); border-radius:22px; width:100%; max-width:480px; padding:1.75rem 1.5rem 2rem;
    box-shadow:0 24px 60px rgba(0,0,0,.28); }
  .brand{ text-align:center; margin-bottom:.4rem; }
  .brand img.logo{ width:200px; max-width:70%; height:auto; }
  h1{ text-align:center; font-size:1.3rem; margin:.4rem 0 .1rem; color:var(--red-dark); }
  .loc{ text-align:center; color:var(--muted); font-size:1rem; margin:0 0 1.1rem; font-weight:600; }
  label{ display:block; font-size:.85rem; color:var(--muted); font-weight:600; margin:.2rem 0 .35rem; }
  input.code{ width:100%; padding:1rem; font-size:1.5rem; letter-spacing:.24em; text-align:center;
    border:2px solid var(--line); border-radius:14px; font-family:inherit; }
  input.code:focus{ outline:none; border-color:var(--gold); }
  .btn{ display:block; width:100%; border:none; border-radius:14px; padding:1rem; font-size:1.1rem; font-weight:700;
    cursor:pointer; margin-top:.8rem; font-family:inherit; }
  .btn.primary{ background:var(--red); color:#fff; } .btn.primary:hover{ background:var(--red-dark); }
  .btn.ok{ background:var(--ok); color:#fff; }
  .btn.ghost{ background:#efe7d9; color:var(--ink); }
  .btn.sm{ padding:.6rem .9rem; font-size:.95rem; width:auto; display:inline-block; margin-top:0; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .row{ display:flex; gap:.6rem; flex-wrap:wrap; } .row .btn{ flex:1; }
  .panel{ margin-top:1rem; border-radius:14px; padding:.9rem 1rem; font-size:1rem; line-height:1.45; }
  .panel.info{ background:var(--ok-bg); color:#14532d; } .panel.err{ background:var(--err-bg); color:var(--err); }
  .panel .big{ font-size:1.15rem; font-weight:700; display:block; margin-bottom:.15rem; }
  .picker a{ display:block; text-align:center; padding:1rem; margin-top:.6rem; border:1px solid var(--line);
    border-radius:14px; text-decoration:none; color:var(--red-dark); font-weight:700; font-size:1.1rem; }
  .picker a:hover{ background:var(--bg); }
  .hint{ text-align:center; color:var(--muted); font-size:.82rem; margin-top:.9rem; }
  .who{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.8rem;
    background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:.55rem .8rem; font-size:.9rem; }
  .who b{ color:var(--red-dark); }
  .who a{ color:var(--muted); font-size:.82rem; text-decoration:underline; cursor:pointer; }
  .scanmsg{ text-align:center; color:var(--muted); font-size:.9rem; margin:.4rem 0; }
  .result{ border:1px solid var(--line); border-radius:14px; padding:.9rem; margin-top:.4rem; background:#fff; }
  .result .name{ font-size:1.1rem; font-weight:700; color:var(--ink); }
  .result .sub{ color:var(--muted); font-size:.9rem; margin-top:.15rem; }
  .fields{ display:flex; gap:.5rem; margin-top:.7rem; flex-wrap:wrap; }
  .fields input, .fields select{ flex:1; min-width:0; padding:.7rem; border:1px solid var(--line); border-radius:10px; font-size:1rem; font-family:inherit; }
  .fields input.qty{ max-width:90px; text-align:center; }
  .tabs{ display:flex; gap:.5rem; margin:.7rem 0 .2rem; flex-wrap:wrap; }
  .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; }
  .manual{ display:flex; gap:.5rem; margin-top:.9rem; }
  .manual input{ flex:1; padding:.7rem; border:1px solid var(--line); border-radius:10px; font-size:1rem; }
  .scan-gs1{ margin-top:.5rem; padding:.5rem .7rem; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; font-size:.9rem; color:#1e3a8a; }
  .scan-diff{ margin-top:.5rem; padding:.5rem .7rem; background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; font-size:.9rem; color:#92400e; }
  .scan-total{ align-self:center; font-weight:600; color:#b45309; white-space:nowrap; margin-left:.4rem; }
  .scan-langs{ margin-top:.5rem; padding:.5rem .7rem; background:#fdf6ec; border:1px solid #f3e2c7; border-radius:10px; font-size:1rem; color:#1f2937; line-height:1.5; }
  .scan-langs .lang-tag{ display:inline-block; min-width:1.5rem; margin-right:.25rem; padding:0 .3rem; border-radius:4px; background:#9a5b08; color:#fff; font-size:.68rem; font-weight:700; text-align:center; vertical-align:middle; }
  .scan-langs .lang-sep{ margin:0 .5rem; color:#cbbca0; }
  .scan-section{ margin-top:.5rem; padding:.5rem .7rem; background:#eef6ef; border:1px solid #cfe6d2; border-radius:10px; font-size:.95rem; color:#14532d; }
  .scan-combo{ display:flex; flex-direction:column; gap:.25rem; }
  .scan-lbl{ font-size:.8rem; color:var(--muted); font-weight:600; }
  .scan-combo select, .scan-combo input{ width:100%; padding:.7rem; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:#fff; }
  .modes{ display:flex; flex-wrap:wrap; gap:.4rem; margin:0 0 .7rem; } .modes .btn{ flex:1 1 auto; white-space:nowrap; }
  .ship-bar{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:.7rem .8rem; margin-bottom:.7rem; }
  .ship-lbl{ display:block; font-size:.82rem; color:var(--muted); margin-bottom:.35rem; }
  .ship-bar select{ width:100%; padding:.7rem; border:1px solid var(--line); border-radius:10px; font-size:1rem; }
  .ship-ord-h{ font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:.6rem 0 .3rem; }
  .ship-ord{ display:flex; justify-content:space-between; gap:.5rem; padding:.35rem .5rem; background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:.25rem; font-size:.9rem; }
  .ship-ord.done{ opacity:.5; text-decoration:line-through; }
  .ship-ord-h b{ color:var(--ink,#111); }
  .ship-queue{ display:flex; flex-direction:column; gap:.3rem; }
  button.ship-ord.pick{ width:100%; text-align:left; cursor:pointer; align-items:center; font:inherit; font-size:.95rem; transition:background .12s, border-color .12s; }
  button.ship-ord.pick:hover, button.ship-ord.pick:active{ background:#f1f5f9; border-color:var(--brand,#2563eb); }
  button.ship-ord.pick .mono{ color:var(--muted); white-space:nowrap; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img class="logo" src="/brand.svg" alt="Phở Hà Nội" /></div>
    <h1 id="title">Inventory Scanner</h1>
    <div class="loc" id="loc"></div>

    <!-- Bare /scanner: location picker -->
    <div class="picker" id="picker" hidden></div>

    <!-- Employee-code entry -->
    <div id="identify" hidden>
      <label for="code">Enter your employee code</label>
      <input class="code" id="code" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="######" aria-label="Employee code" />
      <button class="btn primary" id="go">Continue</button>
      <div class="panel err" id="idErr" hidden></div>
    </div>

    <!-- Scanner (after identify) -->
    <div id="scanner" hidden>
      <div class="who"><span>Scanning as <b id="whoName"></b></span><a id="signout">Not you?</a></div>
      <div class="modes" id="modes"><button class="btn sm primary" data-mode="receive">📥 Receiving</button><button class="btn sm ghost" data-mode="check">📋 Checking Inventory</button></div>
      <div id="shipBar" class="ship-bar" hidden></div>
      <div class="scanmsg" id="scanmsg">📠 Ready — scan a barcode with your scanner.</div>
      <div id="result"></div>
      <div class="manual"><input id="manual" inputmode="numeric" autocomplete="off" placeholder="📠 Scan with your scanner — or type a code" /><button class="btn sm primary" id="manualGo">Go</button></div>
    </div>

    <div class="hint" id="hint"></div>
  </div>
  <footer style="text-align:center;color:rgba(255,255,255,.6);font-size:.72rem;margin-top:1.4rem">© 2026 Phở Hà Nội. All rights reserved.</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (n) => { const x = Number(n); return Number.isInteger(x) ? String(x) : (Math.round(x*100)/100).toString(); };
// Vietnamese + Spanish item names from the Glossary, for kitchen/warehouse staff on scan.
function scanLangs(g){ if(!g) return ''; const vi=(g.name_vi||'').trim(), es=(g.name_es||'').trim(); const p=[]; if(vi)p.push('<span class="lang-tag">VI</span> '+esc(vi)); if(es)p.push('<span class="lang-tag">ES</span> '+esc(es)); return p.length?'<div class="scan-langs">'+p.join('<span class="lang-sep">·</span>')+'</div>':''; }
// Where the item is stored (its shelf/section).
function scanSection(it){ return it && it.section_name ? '<div class="scan-section">📍 Stored on <b>'+esc(it.section_name)+'</b></div>' : ''; }
// When a re-scanned item carries different box data (weight / dates / lot) than the last box on
// hand, show the difference so the user reviews it before adding to the total.
function boxDiffNote(d){
  const lb = d.last_box; if (!lb) return '';
  const diffs = [];
  if (d.weight_lb != null && d.weight_lb !== '' && lb.net_weight_lb != null && +d.weight_lb !== +lb.net_weight_lb) diffs.push('weight '+nf(lb.net_weight_lb)+' → <b>'+nf(d.weight_lb)+'</b> lb');
  if (d.pack_date && lb.pack_date && d.pack_date !== lb.pack_date) diffs.push('packed '+esc(lb.pack_date)+' → <b>'+esc(d.pack_date)+'</b>');
  if (d.expiry && lb.expiry_date && d.expiry !== lb.expiry_date) diffs.push('exp '+esc(lb.expiry_date)+' → <b>'+esc(d.expiry)+'</b>');
  if (d.lot && lb.lot_code && d.lot !== lb.lot_code) diffs.push('lot '+esc(lb.lot_code)+' → <b>'+esc(d.lot)+'</b>');
  if (!diffs.length) return '';
  return '<div class="scan-diff">↔ Different from the last box — '+diffs.join(' · ')+'. Review, then Add to the total.</div>';
}
const UOM_OPTIONS = ['lb','lbs','case','each','bottle','box','bag','can','jar','gallon','oz','kg','pack','dozen','bunch','carton','quart','pint','jug','container','tub','tube','g','liter','ml','fl oz','piece','head','crate','flat','tray','sleeve','roll','sheet','keg','cup','count','unit','pair','order','serving','portion','plate','half gallon','cl','tbsp','tsp','lug','bushel','peck','gross','pallet','sack','pouch','packet','sachet','canister','tin','drum','pail','bucket','barrel','stalk','bulb','clove','ear','sprig','leaf','root','loaf','stick','slice','fillet','rack','side','slab','block','wedge','wheel','round','scoop','ladle','dash','pinch','ream','bar','mg','ton'];
const CATEGORY_OPTIONS = ['Produce','Herbs & Aromatics','Meat','Poultry','Seafood','Noodles','Broth & Soup Base','Rice & Grains','Sauces & Condiments','Spices & Seasonings','Oils & Vinegars','Dry Goods','Canned & Jarred','Dairy','Eggs','Frozen','Deli','Bakery & Bread','Flour & Baking','Sweeteners','Nuts & Seeds','Snacks','Beverages','Juice & Soda','Coffee & Tea','Beer','Wine','Liquor','Bar Supplies','Paper Goods','Disposables & To-Go','Packaging','Cleaning Supplies','Smallwares','Equipment','Office Supplies','Uniforms & Apparel','Other'];
const comboHTML = (key, options, value, label) => { const cur = value == null ? '' : String(value); const inList = options.includes(cur); return `<div class="scan-combo"><label class="scan-lbl">${esc(label)}</label><select data-combo="${key}" id="cb_${key}">${options.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}<option value="__other__" ${(!inList&&cur)?'selected':''}>✏️ Other…</option></select><input id="cbo_${key}" placeholder="Type a ${esc((label||'').toLowerCase())}" value="${esc(!inList?cur:'')}" ${(!inList&&cur)?'':'hidden'}></div>`; };
function comboWire(root){ (root||document).querySelectorAll('[data-combo]').forEach(sel=>{ sel.onchange=()=>{ const o=document.getElementById('cbo_'+sel.dataset.combo); if(o){ const show=sel.value==='__other__'; o.hidden=!show; if(show)o.focus(); } }; }); }
const comboVal = (key) => { const sel=document.getElementById('cb_'+key); if(!sel) return ''; return sel.value==='__other__' ? (((document.getElementById('cbo_'+key)||{}).value)||'').trim() : sel.value; };
const slug = decodeURIComponent(location.pathname.replace(/^\/scanner\/?/, '')).trim();
let empCode = '';
let scanMode = 'receive', shipToId = '', shipToName = '', shipStore = null, LOC_NAME = '', LOC_TYPE = '';

async function api(path, body){
  const opts = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {};
  const r = await fetch('/api/scannerkiosk' + path, opts);
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, d };
}

// ── Hardware barcode scanner (keyboard-wedge) ─────────────────────────────
// A USB/Bluetooth scanner types the code + Enter into the auto-focused field below —
// no phone camera. The field is kept focused so scans land hands-free.
let busy = false;
function startScanner(){
  $('scanmsg').textContent = '📠 Ready — scan a barcode with your scanner.';
  focusManual();
}
const focusManual = () => { const m = $('manual'); if (m) setTimeout(() => { try { m.focus(); } catch {} }, 80); };
function resume(){ busy = false; $('result').innerHTML = ''; $('scanmsg').textContent = '📠 Ready — scan the next barcode.'; focusManual(); }

async function handleCode(code){
  if (busy) return; busy = true;
  try { navigator.vibrate && navigator.vibrate(50); } catch {}
  $('scanmsg').textContent = 'Scanned: ' + code;
  await onScanned(code);
}
const onScanned = (code) => scanMode === 'ship' ? handleShipOrder(code) : (scanMode === 'transfer' ? handleShip(code) : (scanMode === 'check' ? handleCheck(code) : (scanMode === 'use' ? handleUse(code) : handleScan(code))));

// ── Check mode: stock of a scanned item across all locations ──────────────
async function handleCheck(code){
  $('result').innerHTML = '<div class="result">Looking up…</div>';
  const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/stock', { employee_code: empCode, code });
  if (!d.ok){ $('result').innerHTML = `<div class="panel err">${esc(d.error || 'Error')}</div><button class="btn ghost" id="again">Scan another</button>`; $('again').onclick = resume; return; }
  if (!d.found){ $('result').innerHTML = `<div class="result"><div class="name">🔍 Not stocked yet</div><div class="sub mono">${esc(d.code)}</div><button class="btn ghost" id="again">Scan another</button></div>`; $('again').onclick = resume; return; }
  const ls = d.last_scan; const lastLine = ls ? [ls.weight_lb ? `${nf(ls.weight_lb)} lb` : '', ls.lot ? `lot ${esc(ls.lot)}` : '', (ls.pack_date||ls.prod_date) ? `packed ${esc(ls.pack_date||ls.prod_date)}` : '', ls.expiry ? `exp ${esc(ls.expiry)}` : ''].filter(Boolean).join(' · ') : '';
  $('result').innerHTML = `<div class="result"><div class="name">📋 ${esc(d.item_name)}</div><div class="sub">${nf(d.total)} ${esc(d.unit)} across all locations</div>
    <div class="ship-orders">${d.by_location.map(l => `<div class="ship-ord"><span>${esc((l.location||'').replace('Pho Ha Noi — ',''))}${l.type==='central_kitchen'?' (CK)':''}</span><span class="mono">${nf(l.quantity)} ${esc(l.unit)}</span></div>`).join('')}</div>
    ${lastLine ? `<div class="scan-gs1" style="margin-top:.5rem">🏷️ Last scan · ${lastLine}</div>` : ''}
    <button class="btn primary" id="again" style="margin-top:.6rem">Scan another</button></div>`;
  $('again').onclick = resume;
}

// ── Ship-out mode ─────────────────────────────────────────────────────────
async function setMode(m){
  scanMode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.className = 'btn sm ' + (b.dataset.mode === m ? 'primary' : 'ghost'));
  // Shipping fills open orders (queue → store → scan); Transferring is an ad-hoc move to a destination.
  const wantsBar = (m === 'ship' || m === 'transfer');
  $('shipBar').hidden = !wantsBar;
  $('shipBar').dataset.loaded = '';
  $('scanmsg').textContent = m === 'ship' ? 'Pick an order below, then scan the items to ship them.' : (m === 'transfer' ? 'Choose a destination, then scan to transfer stock there.' : (m === 'check' ? 'Scan an item to see stock at every location.' : (m === 'use' ? 'Scan an item to record stock used here.' : '📠 Ready — scan a barcode with your scanner.')));
  if (m === 'ship'){ await renderShipQueue(); }
  else if (m === 'transfer'){
    const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/targets', { employee_code: empCode });
    const tgts = (d && d.targets) || [];
    $('shipBar').innerHTML = `<label class="ship-lbl">Transfer from <b>${esc(LOC_NAME)}</b> to</label><select id="shipTo"><option value="">— choose destination —</option>${tgts.map(t => `<option value="${t.id}">${esc((t.name||'').replace('Pho Ha Noi — ',''))}${t.type==='central_kitchen'?' (CK)':t.type==='warehouse'?' (WH)':''}</option>`).join('')}</select>`;
    $('shipTo').onchange = () => { shipToId = $('shipTo').value; shipToName = $('shipTo').selectedOptions[0] ? $('shipTo').selectedOptions[0].textContent.replace(/\s*\((CK|WH)\)\s*$/,'').trim() : ''; };
  }
}
// Shipping queue: the stores with open orders waiting on THIS hub.
async function renderShipQueue(){
  const box = $('shipBar'); if (!box || scanMode !== 'ship') return;
  if (shipStore) return renderShipStore();
  box.innerHTML = '<div class="sub" style="color:var(--muted)">Loading orders…</div>';
  const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/ship-queue', { employee_code: empCode });
  if (!box || scanMode !== 'ship') return;
  if (!d || !d.ok){ box.innerHTML = `<div class="sub" style="color:var(--muted)">${esc((d && d.error) || 'Could not load orders.')}</div>`; return; }
  const ords = d.orders || [];
  box.innerHTML = `<div class="ship-ord-h">📦 Orders waiting to ship from <b>${esc(LOC_NAME)}</b></div>` +
    (ords.length ? `<div class="ship-queue">${ords.map(o => `<button class="ship-ord pick" data-store="${o.store_id}" data-name="${esc(o.store_name)}"><span>${esc((o.store_name||'').replace('Pho Ha Noi — ',''))}</span><span class="mono">${o.lines} item${o.lines===1?'':'s'}${o.started?' · started':''} ›</span></button>`).join('')}</div>`
      : '<div class="sub" style="color:var(--muted)">No orders waiting to ship. ✅</div>');
  box.querySelectorAll('[data-store]').forEach(b => b.onclick = () => { shipStore = { id: b.dataset.store, name: b.dataset.name }; renderShipStore(); });
}
// One store's open order: lines + how much is shipped / still needed.
async function renderShipStore(){
  const box = $('shipBar'); if (!box || !shipStore) return;
  box.innerHTML = '<div class="sub" style="color:var(--muted)">Loading order…</div>';
  const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/ship-queue', { employee_code: empCode, to_location_id: shipStore.id });
  if (!box || !shipStore) return;
  if (!d || !d.ok){ box.innerHTML = `<div class="sub" style="color:var(--muted)">${esc((d && d.error) || 'Could not load order.')}</div>`; return; }
  const lines = d.lines || [], sn = (shipStore.name||'').replace('Pho Ha Noi — ','');
  box.innerHTML = `<div class="ship-ord-h"><button class="btn sm ghost" id="shipBack">← Orders</button> &nbsp;📤 <b>${esc(sn)}</b> — scan items to ship</div>` +
    (lines.length ? `<div class="ship-queue">${lines.map(o => `<div class="ship-ord${o.remaining<=0.0005?' done':''}"><span>${esc(o.item_name)}</span><span class="mono">${nf(o.shipped_qty)}/${nf(o.ck_qty)} ${esc(o.unit||'')}${o.on_hand<=0.0005?' · ⚠ none here':''}</span></div>`).join('')}</div>`
      : '<div class="sub" style="color:var(--muted)">This order is fully shipped. ✅</div>');
  const bk = $('shipBack'); if (bk) bk.onclick = () => { shipStore = null; renderShipQueue(); };
}
const refreshShip = () => { if (scanMode === 'ship'){ shipStore ? renderShipStore() : renderShipQueue(); } };
// Scan an item to fill the picked store's order.
async function handleShipOrder(code){
  if (!shipStore){ $('result').innerHTML = `<div class="panel err">Pick an order above first, then scan its items.</div><button class="btn ghost" id="again">OK</button>`; $('again').onclick = resume; return; }
  $('result').innerHTML = '<div class="result">Looking up…</div>';
  const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/resolve', { employee_code: empCode, code });
  if (!d.ok){ $('result').innerHTML = `<div class="panel err">${esc(d.error || 'Error')}</div><button class="btn ghost" id="again">Scan another</button>`; $('again').onclick = resume; return; }
  const key = d.code || code;
  if (!d.found){ $('result').innerHTML = `<div class="result"><div class="name">🚫 Not stocked here</div><div class="sub mono">${esc(key)}</div><div class="sub">Nothing to ship from ${esc(LOC_NAME)}.</div><button class="btn ghost" id="again">Scan another</button></div>`; $('again').onclick = resume; return; }
  const it = d.item, sn = (shipStore.name||'').replace('Pho Ha Noi — ','');
  let line = null;
  try { const { d:q } = await api('/kiosk/' + encodeURIComponent(slug) + '/ship-queue', { employee_code: empCode, to_location_id: shipStore.id }); line = ((q && q.lines) || []).find(l => l.item_name === it.item_name && l.remaining > 0.0005); } catch {}
  if (!line){ $('result').innerHTML = `<div class="result"><div class="name">⚠ ${esc(it.item_name)}</div><div class="sub">isn't on ${esc(sn)}'s order (or already fully shipped).</div><button class="btn ghost" id="again">Scan another</button></div>`; $('again').onclick = resume; return; }
  const dflt = d.weight_lb || line.remaining || 1;
  $('result').innerHTML = `<div class="result"><div class="name">📤 ${esc(it.item_name)}</div><div class="sub">${nf(it.quantity)} ${esc(it.unit)} on hand · order needs ${nf(line.remaining)} ${esc(line.unit||it.unit)} → <b>${esc(sn)}</b></div>${scanLangs(d.glossary)}${scanSection(it)}

// Cost / purchase history for a scanned item at this kiosk's location — every purchase (lot) is a
// cost layer with the price paid that time. Unit cost is editable inline (fix a typo or add the real
// invoice price later); the newest layer also updates the item's current price.
async function showCostHistory(itemId, name, unit){
  const box = $('result');
  const m2 = (n) => '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2);
  const ts = (s) => { try { return new Date(String(s).replace(' ','T')+'Z').toLocaleString([], {month:'short',day:'numeric',year:'numeric'}); } catch { return s||'—'; } };
  box.innerHTML = '<div class="result"><div class="sub" style="color:var(--muted)">Loading cost history…</div></div>';
  const { d } = await api('/kiosk/' + encodeURIComponent(slug) + '/cost-history', { employee_code: empCode, item_id: itemId });
  if (!d || !d.ok){ box.innerHTML = `<div class="result"><div class="sub">${esc((d&&d.error)||'Could not load cost history.')}</div><button class="btn ghost" id="again">Back</button></div>`; $('again').onclick = resume; return; }
  const u = d.item.unit || unit || '';
  const rows = (d.lots||[]).map(l => `<div class="ship-ord${l.remaining<=0.0005?' done':''}">
      <span>${esc(ts(l.received_at))}${l.remaining<=0.0005?' · used up':''}<br><span style="color:var(--muted);font-size:.8rem">${nf(l.received_qty)} bought · ${nf(l.remaining)} left${l.net_weight_lb?' · '+nf(l.net_weight_lb)+' lb':''}</span></span>
      <span style="white-space:nowrap">$<input class="ch-cost" data-lot="${l.id}" type="number" step="0.01" min="0" value="${l.unit_cost}" style="width:4.6rem;text-align:right"> <button class="btn ok" data-save="${l.id}" disabled style="padding:.25rem .55rem">Save</button></span>
    </div>`).join('');
  box.innerHTML = `<div class="result"><div class="name">💲 ${esc(name)}</div>
    <div class="sub">On-hand value <b>${m2(d.totals.on_hand_value)}</b> · ${nf(d.totals.on_hand_qty)} ${esc(u)} · avg ${m2(d.totals.avg_cost)}/${esc(u)} · purchased ${m2(d.totals.purchased_value)}</div>
    <div class="sub" style="color:var(--muted);font-size:.8rem">Each row is one purchase. Edit the unit cost to record the true price paid.</div>
    <div class="ship-queue" style="margin:.5rem 0">${rows || '<div class="sub">No purchases recorded yet.</div>'}</div>
    <button class="btn primary" id="again">Scan another</button></div>`;
  $('again').onclick = resume;
  box.querySelectorAll('.ch-cost').forEach(inp => {
    const lot = inp.dataset.lot, orig = inp.value, btn = box.querySelector(`[data-save="${lot}"]`);
    inp.oninput = () => { btn.disabled = (inp.value === orig || inp.value === '' || !(parseFloat(inp.value) >= 0)); };
    btn.onclick = async () => {
      btn.disabled = true;
      const { d:r } = await api('/kiosk/' + encodeURIComponent(slug) + '/lot-cost', { employee_code: empCode, lot_id: lot, unit_cost: inp.value });
      if (!r || !r.ok){ alert((r&&r.error)||'Could not update cost.'); btn.disabled = false; return; }
      showCostHistory(itemId, name, unit);
    };
  });
}

async function start(){
  if (!slug){
    $('title').textContent = 'Choose your location';
    const { d } = await api('/kiosk-locations');
    const wrap = $('picker'); wrap.hidden = false;
    wrap.innerHTML = (Array.isArray(d)?d:[]).map(l => `<a href="/scanner/${encodeURIComponent(l.slug)}">${esc(l.display)}</a>`).join('') || '<p class="hint">No locations available.</p>';
    return;
  }
  const { ok, d } = await api('/kiosk/' + encodeURIComponent(slug));
  if (!ok){ $('title').textContent = 'Location not found'; $('loc').textContent = 'Check the address and try again.'; return; }
  document.title = 'Scanner — ' + d.display;
  LOC_NAME = (d.display || '').replace('Pho Ha Noi ', '').trim() || 'this location';
  LOC_TYPE = d.type || 'restaurant';
  // Section-aware modes: the Warehouse & Central Kitchen (hubs) add Shipping (fulfil store orders);
  // a store has no orders to fulfil, so it gets Receiving / Transferring / Checking Inventory.
  const isHub = (LOC_TYPE === 'central_kitchen' || LOC_TYPE === 'warehouse');
  const MODES = isHub
    ? [['receive','📥 Receiving'],['ship','📤 Shipping'],['transfer','🔁 Transferring'],['check','📋 Checking Inventory'],['use','🍳 Use']]
    : [['receive','📥 Receiving'],['transfer','🔁 Transferring'],['check','📋 Checking Inventory'],['use','🍳 Use']];
  $('modes').innerHTML = MODES.map((m,i) => `<button class="btn sm ${i?'ghost':'primary'}" data-mode="${m[0]}">${esc(m[1])}</button>`).join('');
  $('loc').textContent = d.display;
  $('identify').hidden = false;
  $('hint').textContent = 'Enter your employee code, then scan any product barcode to receive or count stock.';
  $('go').onclick = identify;
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') identify(); });
  $('signout').onclick = signOut;
  $('manualGo').onclick = () => { const c = ($('manual').value||'').trim(); if (c){ $('manual').value=''; handleCode(c); focusManual(); } };
  $('manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('manualGo').click(); });
  $('code').focus();
}
start();
</script>
</body>
</html>
