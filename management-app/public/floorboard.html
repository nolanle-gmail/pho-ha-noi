<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7f1414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Floor — Phở Hà Nội</title>
<style>
  :root{
    --brand:#B91C1C; --brand-deep:#7f1414; --ink:#241a15; --muted:#6e5f51; --line:#e7dccc;
    --paper:#f3ede3; --board:#fbf9f4; --wall:#cdbda4;
    /* 5 live service-flow buckets (match the Management Floor Plan) */
    --c-available:#1e7e34; --bg-available:#e6f4ea;
    --c-seated:#2b5bd7;    --bg-seated:#e7eefc;
    --c-awaiting_food:#c2410c; --bg-awaiting_food:#ffedd5;
    --c-ready_to_pay:#6d28d9;  --bg-ready_to_pay:#ede9fe;
    --c-cleaning:#6b7280;  --bg-cleaning:#ededed;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header{ background:linear-gradient(180deg,var(--brand-deep),var(--brand)); color:#fff;
    padding:calc(.5rem + env(safe-area-inset-top)) 1.1rem .55rem; display:flex; align-items:center; gap:1rem; flex:0 0 auto; }
  header img.logo{ height:34px; width:auto; }
  header .h-t{ font-weight:800; font-size:1.5rem; display:flex; align-items:baseline; gap:.55rem; white-space:nowrap; }
  header .h-loc{ opacity:.95; font-weight:700; }
  header .spacer{ flex:1; }
  /* legend strip lives in the header so the board gets the whole screen */
  .legend{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .leg{ background:rgba(255,255,255,.14); border-radius:999px; padding:.28rem .7rem; font-weight:700; font-size:1rem;
    display:inline-flex; align-items:center; gap:.45rem; white-space:nowrap; }
  .leg .dot{ width:.85rem; height:.85rem; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.35) inset; }
  .leg .n{ font-variant-numeric:tabular-nums; opacity:.95; }
  header .clock{ font-weight:800; font-size:1.35rem; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  header .upd{ opacity:.8; font-size:.72rem; margin-top:.1rem; text-align:right; }
  header button{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:10px; font:inherit; font-weight:800; font-size:1.2rem; padding:.3rem .6rem; cursor:pointer; }
  header .clockwrap{ display:flex; flex-direction:column; align-items:flex-end; }
  main{ flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center; padding:.6rem; min-height:0; }

  /* ── The floor board: a fitted coordinate space; tables sit at pos_x/pos_y % ── */
  .board{ position:relative; background:var(--board); border:3px solid var(--wall); border-radius:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.12); }
  .room-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .room-svg polygon{ fill:rgba(205,189,164,.12); stroke:var(--wall); stroke-width:.5; }
  .band{ position:absolute; transform:translateY(-120%); left:1%; font-weight:800; color:var(--muted);
    font-size:calc(var(--u) * 2.1); letter-spacing:.02em; text-transform:uppercase; opacity:.7; pointer-events:none; }
  .t{ position:absolute; transform:translate(-50%,-50%); width:var(--tw); height:var(--tw);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border:var(--tb) solid var(--c); background:var(--bg); color:var(--c);
    border-radius:50%; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.1); }
  .t.sq{ border-radius:18%; }
  .t.off{ opacity:.25; }
  .t .lbl{ font-weight:800; font-size:calc(var(--tw) * .40); line-height:1; }
  .t .sub{ font-weight:700; font-size:calc(var(--tw) * .17); line-height:1.1; margin-top:.12em; color:var(--ink); opacity:.82;
    max-width:94%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t .srv{ font-weight:800; font-size:calc(var(--tw) * .16); line-height:1.05; margin-top:.1em; color:var(--c); }
  .t.due{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 2px 6px rgba(0,0,0,.1);} 50%{ box-shadow:0 0 0 calc(var(--tb)*1.4) color-mix(in srgb,var(--c) 45%,transparent);} }

  /* ── Area-panel layout (for tall floors that can't fill a landscape TV) ── */
  .apanels{ display:grid; gap:10px; }
  .apanel{ background:var(--board); border:2px solid var(--wall); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 3px 10px rgba(0,0,0,.08); min-height:0; }
  .apanel-h{ background:color-mix(in srgb,var(--wall) 24%, var(--board)); color:var(--ink);
    font-weight:800; padding:.3rem .7rem; display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    border-bottom:1px solid var(--wall); white-space:nowrap; }
  .apanel-h .nm{ overflow:hidden; text-overflow:ellipsis; }
  .apanel-h .ct{ color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
  .apanel-b{ flex:1 1 auto; display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
    gap:8px; padding:10px; overflow:hidden; }
  .pt{ width:var(--pt); height:var(--pt); border-radius:50%; border:calc(var(--pt) * .09) solid var(--c);
    background:var(--bg); color:var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .pt.sq{ border-radius:18%; }
  .pt.off{ opacity:.25; }
  .pt .l{ font-weight:800; line-height:1; }
  .pt .s{ font-weight:700; line-height:1.05; margin-top:.1em; color:var(--c); max-width:94%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pt.due{ animation:pulse 1.6s ease-in-out infinite; }

  .picks{ max-width:560px; margin:auto; display:grid; gap:.7rem; width:100%; padding:1rem; }
  .pick{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.3rem; font-size:1.35rem; font-weight:800;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-decoration:none; color:var(--ink); }
  .pick .cnt{ color:var(--muted); font-weight:600; font-size:1rem; }
  .pick::after{ content:"›"; color:var(--muted); font-size:1.7rem; margin-left:.6rem; }
  .note{ text-align:center; color:var(--muted); padding:3rem 1rem; font-size:1.3rem; max-width:620px; }
  .note h2{ color:var(--ink); font-size:1.8rem; margin:.3rem 0; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/brand.svg" alt="Phở Hà Nội" onerror="this.style.display='none'" />
  <div class="h-t">🍽️ Floor <span class="h-loc" id="hLoc"></span></div>
  <div class="spacer"></div>
  <div class="legend" id="legend"></div>
  <div class="clockwrap"><div class="clock" id="clock">—</div><div class="upd" id="upd"></div></div>
  <button id="full" title="Fullscreen">⛶</button>
</header>
<main id="main"><div class="note">Loading…</div></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const shortLoc = (n) => String(n || '').replace(/^Ph[oở]\s*H[aà]\s*N[oộ]i\s*[—–-]\s*/i, '').trim() || n;
const SLUG = decodeURIComponent((location.pathname.match(/^\/floorplan\/(.+?)\/?$/i) || [, ''])[1] || '').trim();

// The 5 display buckets → [label, cssVarSuffix]. Order = legend order.
const BUCKETS = [
  ['available', 'Available'], ['seated', 'Seated'], ['awaiting_food', 'Awaiting food'],
  ['ready_to_pay', 'Ready to pay'], ['cleaning', 'Cleaning up'],
];
const LEGACY = { available:'available', waiting_to_order:'seated', served:'ready_to_pay', waiting_to_pay:'ready_to_pay', cleaning:'cleaning' };
const dispKey = (t) => t.display || LEGACY[t.status] || 'available';

let timer = null, lastData = null;

async function api(path) {
  const r = await fetch('/api/floorboard' + path, { headers: { 'Content-Type': 'application/json' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok && !d.error) throw new Error('Something went wrong.');
  return d;
}

// Keep the screen awake (TVs/tablets) + a live wall clock.
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (SLUG) load(); } });
function tickClock() { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
setInterval(tickClock, 15000); tickClock();
$('full').onclick = () => { const el = document.documentElement; if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el); else document.exitFullscreen && document.exitFullscreen(); };

// ── Bare /Floorplan: pick a store ───────────────────────────────────────────
async function pickStore() {
  $('hLoc').textContent = ''; $('legend').innerHTML = ''; $('upd').textContent = '';
  let d; try { d = await api('/locations'); } catch { $('main').innerHTML = '<div class="note">Couldn’t load locations. Try again.</div>'; return; }
  if (!d.locations || !d.locations.length) { $('main').innerHTML = '<div class="note">No locations have a floor plan set up yet.</div>'; return; }
  $('main').innerHTML = '<div class="picks"><div class="note" style="padding:0 0 .4rem">Pick a location to show on this screen — then bookmark it / add to the home screen.</div>'
    + d.locations.map(l => `<a class="pick" href="/Floorplan/${esc(l.slug || l.name)}">${esc(shortLoc(l.name))}<span class="cnt">${l.tables} tables</span></a>`).join('') + '</div>';
}

const natCmp = (x, y) => String(x.label).localeCompare(String(y.label), undefined, { numeric: true });
const bucketLabel = (k) => (BUCKETS.find(b => b[0] === k) || [, ''])[1];

// ── Per-store board: header/legend, then draw() picks the best layout ────────
function render(d) {
  lastData = d;
  $('hLoc').textContent = shortLoc(d.location.name || '');
  document.title = 'Floor · ' + shortLoc(d.location.name || '');
  const all = (d.areas || []).flatMap(a => a.tables);
  const counts = {}; all.forEach(t => { const k = dispKey(t); counts[k] = (counts[k] || 0) + 1; });
  $('legend').innerHTML = BUCKETS.map(([k, lbl]) =>
    `<span class="leg"><span class="dot" style="background:var(--c-${k})"></span>${lbl} <span class="n">${counts[k] || 0}</span></span>`).join('');
  $('upd').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  if (!all.length) { $('main').innerHTML = '<div class="note"><h2>No floor plan yet</h2>Set one up in the Management app under Locations → Floor Plan.</div>'; return; }
  draw();
}

// Re-draw the current data at the current screen size — chooses the exact scaled
// map for wide floors, or the area-panel layout when that map would be a thin
// strip on a landscape screen (the tall Toast-regrouped floors).
function draw() {
  const d = lastData; if (!d) return;
  const main = $('main');
  const availW = main.clientWidth - 16, availH = main.clientHeight - 16;
  const realAreas = (d.areas || []).filter(a => a.tables && a.tables.length);
  const ratio = (Number(d.aspect) > 0 ? Number(d.aspect) : 62) / 100; // height / width
  let mw = availW, mh = mw * ratio; if (mh > availH) { mh = availH; mw = mh / ratio; }
  const landscape = availW >= availH * 1.05;
  const usePanels = landscape && realAreas.length >= 2 && mw < availW * 0.72;
  if (usePanels) drawPanels(realAreas, availW, availH);
  else drawMap(d, availW, availH, ratio);
}

// Faithful scaled map: the real room outline + tables at their pos_x/pos_y.
function drawMap(d, availW, availH, ratio) {
  const all = (d.areas || []).flatMap(a => a.tables);
  const outline = d.room_outline || [];
  const svg = outline.length >= 3
    ? `<svg class="room-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="${outline.map(p => `${p.x},${p.y}`).join(' ')}"/></svg>` : '';
  const bands = (d.areas || []).map(a => {
    const ts = (a.tables || []).filter(t => t.pos_y != null);
    if (!ts.length || !a.name || a.name === 'Other') return '';
    return `<div class="band" style="top:${Math.min(...ts.map(t => t.pos_y))}%">${esc(a.name)}</div>`;
  }).join('');
  const tiles = all.map(t => {
    const k = dispKey(t), occ = k !== 'available';
    const srv = occ && t.server_name ? esc(String(t.server_name).split(' ')[0]) : '';
    const sub = occ
      ? [t.party_size ? t.party_size + '👤' : '', t.minutes_to_free != null ? '~' + t.minutes_to_free + 'm' : ''].filter(Boolean).join(' · ')
      : (t.seats ? t.seats + ' seats' : '');
    const due = t.stage === 'in_service' && t.check_due;
    return `<div class="t ${t.shape === 'square' ? 'sq' : ''}${t.is_active ? '' : ' off'}${due ? ' due' : ''}"
        style="left:${t.pos_x}%;top:${t.pos_y}%;--c:var(--c-${k});--bg:var(--bg-${k})"
        title="${esc(t.label)} — ${esc(occ ? bucketLabel(k) : 'Available')}">
        <div class="lbl">${esc(t.label)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${srv ? `<div class="srv">${srv}${due ? ' ⏰' : ''}</div>` : ''}
      </div>`;
  }).join('');
  $('main').innerHTML = `<div class="board" id="board">${svg}${bands}${tiles}</div>`;
  const board = $('board');
  let w = availW, h = w * ratio; if (h > availH) { h = availH; w = h / ratio; }
  board.style.width = w + 'px'; board.style.height = h + 'px';
  const tw = Math.max(46, Math.min(w, h) * 0.085);
  board.style.setProperty('--u', (w / 100) + 'px');
  board.style.setProperty('--tw', tw + 'px');
  board.style.setProperty('--tb', Math.max(3, tw * 0.09) + 'px');
}

// Largest circle size so `c` tiles fit in a panel of outer size W×H. Accounts for the
// real CSS insets (panel border ~4px, body padding 10px each side, 8px gap) so the fit is
// exact — an over-optimistic estimate was letting tiles overflow and clip.
function tileFit(W, H, c) {
  const G = 8, P = 10, B = 4;                 // gap · body padding · panel border
  const aw = W - B - 2 * P, ah = H - B - 2 * P;
  if (c <= 0 || aw <= 0 || ah <= 0) return 36;
  for (let t = Math.min(aw, ah); t > 20; t -= 2) {
    const per = Math.max(1, Math.floor((aw + G) / (t + G)));
    if (Math.ceil(c / per) * (t + G) - G <= ah) return Math.floor(t);
  }
  return 20;
}

// Area-panel layout: each service area is its own panel of big colour-coded
// tiles, arranged to fill a landscape screen. Keeps the room readable on a TV
// when the true map would be a narrow vertical strip.
function drawPanels(areas, W, H) {
  const n = areas.length, gap = 10;
  let best = { cols: 1, rows: n, score: -1e9 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols), cw = W / cols, ch = H / rows;
    // Prefer big cells, a slightly-wide cell shape, and no empty (unused) grid cells.
    const score = Math.min(cw, ch) - Math.abs((cw / ch) - 1.3) * 25 - (cols * rows - n) * 30;
    if (score > best.score) best = { cols, rows, score };
  }
  const cols = best.cols, rows = best.rows;
  const ch = (H - (rows - 1) * gap) / rows;
  const headH = Math.max(26, Math.min(44, ch * 0.16));
  const bodyH = ch - headH;   // panel body outer height (tileFit subtracts its own insets)
  // Column widths follow their content: a sparse area gets a narrower panel (not a big empty one),
  // weighted by sqrt(table count) so a busy area gets more room without swamping the others. The
  // width a column gets is driven by its busiest panel.
  const colWt = [];
  for (let c = 0; c < cols; c++) {
    let w = 0;
    for (let r = 0; r < rows; r++) { const i = r * cols + c; if (i < n) w = Math.max(w, Math.sqrt(areas[i].tables.length || 1)); }
    colWt[c] = w || 1;
  }
  const sumWt = colWt.reduce((a, b) => a + b, 0), usableW = W - (cols - 1) * gap;
  const colPx = colWt.map(w => usableW * w / sumWt);
  // Each panel fills its own (content-sized) column — tiles aren't forced to one size, so a
  // sparse area reads fine instead of looking shrunken. A gentle cap (1.35× the busiest area's
  // tile) keeps the board proportionate so no one area looks dramatically bigger.
  const raw = areas.map((a, i) => tileFit(colPx[i % cols], bodyH, a.tables.length));
  const base = Math.min(...raw);
  const html = areas.map((a, i) => {
    const ts = [...a.tables].sort(natCmp);
    const occ = ts.filter(t => dispKey(t) !== 'available').length;
    const pt = Math.min(raw[i], base * 1.35);
    const tiles = ts.map(t => {
      const k = dispKey(t), occT = k !== 'available';
      const srv = occT ? (t.server_name ? esc(String(t.server_name).split(' ')[0]) : (t.party_size ? t.party_size + '👤' : '')) : '';
      const due = t.stage === 'in_service' && t.check_due;
      return `<div class="pt ${t.shape === 'square' ? 'sq' : ''}${t.is_active ? '' : ' off'}${due ? ' due' : ''}"
          style="--c:var(--c-${k});--bg:var(--bg-${k})" title="${esc(t.label)} — ${esc(occT ? bucketLabel(k) : 'Available')}">
          <div class="l" style="font-size:${(pt * 0.4).toFixed(1)}px">${esc(t.label)}</div>
          ${pt >= 46 && srv ? `<div class="s" style="font-size:${(pt * 0.18).toFixed(1)}px">${srv}${due ? ' ⏰' : ''}</div>` : ''}
        </div>`;
    }).join('');
    return `<div class="apanel"><div class="apanel-h"><span class="nm">${esc(a.name || 'Area')}</span><span class="ct">${occ ? occ + ' busy · ' : ''}${ts.length}</span></div>
      <div class="apanel-b" style="--pt:${pt}px">${tiles}</div></div>`;
  }).join('');
  $('main').innerHTML = `<div class="apanels" style="grid-template-columns:${colWt.map(w => w.toFixed(3) + 'fr').join(' ')};grid-template-rows:repeat(${rows},1fr);width:${W}px;height:${H}px">${html}</div>`;
}

async function load() {
  clearTimeout(timer);
  if (!SLUG) return;
  let d; try { d = await api('/board?slug=' + encodeURIComponent(SLUG)); }
  catch (e) { if (!lastData) $('main').innerHTML = `<div class="note">${esc(e.message)}</div>`; timer = setTimeout(load, 15000); return; }
  if (!d.ok) { $('main').innerHTML = `<div class="note"><h2>Floor board unavailable</h2>${esc(d.error || '')}</div>`; return; }
  render(d);
  timer = setTimeout(load, 8000);   // refresh every 8s
}

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(draw, 150); });
(function boot() { keepAwake(); if (SLUG) load(); else pickStore(); })();
</script>
</body>
</html>
