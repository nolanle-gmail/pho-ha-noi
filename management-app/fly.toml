# fly.toml — Pho Ha Noi Enterprise Restaurant Management System
# Change `app` to your own unique name before the first deploy.
app = "pho-ha-noi-management"
primary_region = "sjc"            # San Jose — closest to the Bay Area stores

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/phohanoi_management.db"   # persists on the mounted volume
  TRUST_PROXY = "1"                          # Fly runs behind a proxy → real client IP in logs/audit

# SQLite = one writer on one disk, so run exactly ONE machine (`fly scale count 1`).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1        # keep the app always reachable

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# Persistent disk for the SQLite database.
[mounts]
  source = "phn_management_data"
  destination = "/data"

# Dedicated CPU + 2 GB RAM. node:sqlite is synchronous and single-threaded, so a
# shared (burstable) core gets throttled under background sweeps + concurrent staff
# polls, causing intermittent "slow/unresponsive". A dedicated vCPU removes the
# noisy-neighbour throttling; 2 GB gives the 2.4 GB DB more page cache. NOTE: keep
# this in sync with the live machine — a `fly deploy` reconciles the machine TO this
# block, so an out-of-date size here would silently shrink prod on the next deploy.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
