name: Deploy to Fly

# MANUAL, off-peak deploys. Pushing to main NO LONGER auto-deploys: each deploy fully
# restarts the single Fly machine (~10-25s of refused connections — a staff-facing
# outage), so deploying on every small push meant repeated outages during service.
# CI smoke tests still run on every push (ci.yml); this workflow lands the batched,
# reviewed changes when YOU choose a quiet window.
#
# Deploy via the Actions tab → "Deploy to Fly" → Run workflow, or:
#   gh workflow run "Deploy to Fly" -f app=management     # just the management app
#   gh workflow run "Deploy to Fly" -f app=both           # both apps
# Each job re-runs the smoke suite as a gate before deploying. Requires the
# FLY_API_TOKEN repo secret (Settings → Secrets and variables → Actions).

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        default: both
        options: [both, management, waitlist]

jobs:
  management-app:
    if: ${{ inputs.app == 'both' || inputs.app == 'management' }}
    runs-on: ubuntu-latest
    concurrency:
      group: fly-management
      cancel-in-progress: false
    defaults:
      run:
        working-directory: management-app
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: management-app/package-lock.json
      - run: npm ci
      - name: Smoke test (deploy gate)
        run: npm run seed && npm run smoke
      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Skip (no FLY_API_TOKEN yet)
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN not set — smoke passed, skipping deploy. Add the secret to enable deploy."

  waitlist-app:
    if: ${{ inputs.app == 'both' || inputs.app == 'waitlist' }}
    runs-on: ubuntu-latest
    concurrency:
      group: fly-waitlist
      cancel-in-progress: false
    defaults:
      run:
        working-directory: waitlist-app
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: waitlist-app/package-lock.json
      - run: npm ci
      - name: Smoke test (deploy gate)
        run: npm run seed && npm run smoke
      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Skip (no FLY_API_TOKEN yet)
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN not set — smoke passed, skipping deploy. Add the secret to enable deploy."
